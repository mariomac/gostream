name: Unit tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up tools
      uses: jdx/mise-action@v5
    
    - name: Lint
      run: mise lint

    - name: Test
      run: mise test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
